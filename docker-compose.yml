# Updated AnnaVerse Docker Compose (without nginx container)
# nginx is now handled by host-level nginx for unified configuration
#
# Changes from original:
# 1. Removed nginx service entirely
# 2. Added port mapping 3000:3000 for app service
# 3. App now accessible on host at localhost:3000

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: annaverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annaverse}
      POSTGRES_USER: ${POSTGRES_USER:-annaverse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - annaverse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annaverse_user} -d ${POSTGRES_DB:-annaverse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AnnaVerse Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annaverse_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-annaverse_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-annaverse}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      MAILJET_API_KEY: 92a0a0ad886cd6d776f4bc62194fda2b
      MAILJET_SECRET_KEY: 5d777670fbf7237569f46155f7d8e3bc
      REPLIT_DB_URL: ${REPLIT_DB_URL:-}
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    # ADDED: Expose port to host for nginx
    ports:
      - "3000:3000"
    networks:
      - annaverse_network
    volumes:
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # REMOVED: nginx service - now handled by host nginx

  # Optional: Redis for session storage (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: annaverse_redis
  #   restart: unless-stopped
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   environment:
  #     REDIS_PASSWORD: ${REDIS_PASSWORD}
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - annaverse_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  # Removed: nginx_cache, nginx_logs
  # redis_data:
  #   driver: local

networks:
  annaverse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
